name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: budgetcitoyen_test
          POSTGRES_USER: budgetcitoyen
          POSTGRES_PASSWORD: budgetcitoyen
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U budgetcitoyen"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://budgetcitoyen:budgetcitoyen@localhost:5432/budgetcitoyen_test
      REDIS_URL: redis://localhost:6379/0
      DATA_ECONOMIE_BASE_URL: https://www.data.economie.gouv.fr
      DATA_GOUV_BASE_URL: https://www.data.gouv.fr
      CORS_ORIGINS: http://localhost:5173
      ENV: test

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (black)
        run: black --check .

      - name: Type check (mypy)
        run: mypy api

      - name: Tests
        run: pytest --cov=api

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v7

      - name: Build Docker image
        run: docker build .
